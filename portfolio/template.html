<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RANG | DJ Portfolio</title>
<link rel="icon" type="image/jpeg" href="/media/cropped%20rang%20holi%20pic.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5LTQNCTRJV"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5LTQNCTRJV', { anonymize_ip: true });
</script>
<style>
  :root {
    --primary: #FFCB05;
    --primary-light: #FFD633;
    --secondary: #00274C;
    --bg-dark: #0A0E1A;
    --bg-darker: #050810;
    --bg-light: #151A26;
    --text-light: #FFFFFF;
    --text-dim: rgba(255, 255, 255, 0.72);
    --text-muted: rgba(255, 255, 255, 0.5);
    --border: rgba(255, 203, 5, 0.22);
    --rang-orange: #FF8A3D;
    --rang-orange-glow: rgba(255, 138, 61, 0.45);
    --rang-green: #4ECF55;
    --rang-green-glow: rgba(78, 207, 85, 0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg-dark);
    color: var(--text-light);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  @media print {
    body * { display: none !important; }
    body::after {
      content: "Printing this document is disabled.";
      display: block !important;
      padding: 40px; font: 18px sans-serif;
    }
  }

  /* =====================================
     Lock screen
     ===================================== */
  .gate {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 25% 18%, rgba(255, 138, 61, 0.12), transparent 42%),
      radial-gradient(circle at 78% 80%, rgba(78, 207, 85, 0.10), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(0, 39, 76, 0.55), transparent 55%),
      var(--bg-dark);
  }
  .gate-card {
    width: 100%;
    max-width: 420px;
    background: rgba(21, 26, 38, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 38px 28px;
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
    text-align: center;
  }
  .gate-eyebrow {
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-family: 'Outfit', sans-serif;
  }
  .gate-title {
    font-family: 'Outfit', sans-serif;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -0.8px;
    margin-bottom: 8px;
    line-height: 1;
  }
  .gate-title .orange { color: var(--rang-orange); text-shadow: 0 0 24px var(--rang-orange-glow); }
  .gate-title .green  { color: var(--rang-green);  text-shadow: 0 0 24px var(--rang-green-glow); }
  .gate-sub {
    color: var(--text-dim);
    font-size: 13px;
    margin: 12px auto 24px;
    line-height: 1.55;
    max-width: 320px;
  }
  .gate-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .gate-input-wrap { position: relative; }
  .gate-input {
    width: 100%;
    padding: 12px 60px 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(10, 14, 26, 0.6);
    color: var(--text-light);
    font-size: 15px;
    letter-spacing: 1px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .gate-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255, 203, 5, 0.15);
  }
  .gate-show-pw {
    position: absolute;
    top: 50%; right: 8px;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
  }
  .gate-show-pw:hover { color: var(--primary); }
  .gate-btn {
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: var(--secondary);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .gate-btn:hover { background: var(--primary-light); transform: translateY(-1px); box-shadow: 0 6px 22px rgba(255, 203, 5, 0.35); }
  .gate-btn:disabled { opacity: 0.6; cursor: progress; transform: none; box-shadow: none; }
  .gate-error { margin-top: 12px; color: #ff7a7a; font-size: 13px; min-height: 18px; }
  .gate-foot {
    margin-top: 22px;
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.55;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 14px;
  }

  /* =====================================
     Portfolio document (post-unlock)
     ===================================== */
  .viewer { display: none; }
  .viewer.active { display: block; }

  .pdoc {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 100px;
    font-family: 'Poppins', sans-serif;
  }

  .pdoc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 56px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .pdoc-header-left {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .pdoc-socials { display: flex; gap: 10px; }
  .pdoc-socials a {
    color: var(--primary);
    width: 42px; height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255, 203, 5, 0.08);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .pdoc-socials a:hover { background: rgba(255, 203, 5, 0.2); transform: translateY(-2px); }
  .pdoc-contact-info { display: flex; flex-direction: column; gap: 2px; }
  .pdoc-contact-label {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rang-orange);
    font-weight: 800;
  }
  .pdoc-contact-handle {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    color: var(--text-light);
    font-weight: 700;
  }
  .pdoc-brand-mark {
    height: 70px;
    width: auto;
    filter: drop-shadow(0 0 28px rgba(255, 203, 5, 0.28));
  }

  .pdoc-title {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(52px, 9vw, 110px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 0.95;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .pdoc-title .orange { color: var(--rang-orange); text-shadow: 0 6px 30px var(--rang-orange-glow); }
  .pdoc-title .green  { color: var(--rang-green);  text-shadow: 0 6px 30px var(--rang-green-glow); }

  .pdoc-intro {
    font-size: clamp(16px, 1.6vw, 19px);
    line-height: 1.75;
    color: var(--text-light);
    max-width: 820px;
    margin: 0 auto 28px;
    text-align: center;
    font-weight: 400;
  }
  .pdoc-intro strong { font-weight: 800; }
  .pdoc-intro .orange { color: var(--rang-orange); }
  .pdoc-intro .green  { color: var(--rang-green); }

  .pdoc-confidential {
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
    font-style: italic;
    max-width: 760px;
    margin: 0 auto 72px;
    padding: 18px 24px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    line-height: 1.6;
    letter-spacing: 0.2px;
  }

  .pdoc-section { margin-top: 16px; }
  .pdoc-section-title {
    font-family: 'Outfit', sans-serif;
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: -1.5px;
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 40px;
    line-height: 1;
  }
  .pdoc-section-title .orange { color: var(--rang-orange); text-shadow: 0 4px 24px var(--rang-orange-glow); }
  .pdoc-section-title .green  { color: var(--rang-green);  text-shadow: 0 4px 24px var(--rang-green-glow); }

  .pdoc-row {
    display: grid;
    gap: 20px;
    margin-bottom: 24px;
  }
  .pdoc-row--two,
  .pdoc-row--four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 720px) {
    .pdoc-row--two,
    .pdoc-row--four { grid-template-columns: 1fr; }
  }

  .pdoc-card {
    background: rgba(21, 26, 38, 0.7);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .pdoc-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 203, 5, 0.4);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
  }
  .pdoc-card-title {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.2;
  }
  .pdoc-card-title.orange { color: var(--rang-orange); text-shadow: 0 0 14px var(--rang-orange-glow); }
  .pdoc-card-title.green  { color: var(--rang-green);  text-shadow: 0 0 14px var(--rang-green-glow); }

  .pdoc-embed {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .pdoc-embed > iframe,
  .pdoc-embed > video,
  .pdoc-embed > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border: 0;
    display: block;
  }
  .pdoc-embed--tiktok    { aspect-ratio: 9 / 16; max-width: 360px; margin: 0 auto; }
  .pdoc-embed--instagram { aspect-ratio: 5 / 6;  max-width: 480px; margin: 0 auto; }
  .pdoc-embed--video     { aspect-ratio: 9 / 16; max-width: 360px; margin: 0 auto; }

  /* Floating Lock button */
  .lock-btn {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 50;
    background: rgba(0, 39, 76, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    color: var(--primary);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .lock-btn:hover { background: rgba(0, 39, 76, 0.95); border-color: var(--primary); }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1 class="gate-title"><span class="orange">RANG</span> DJ <span class="green">PORTFOLIO</span></h1>
    <p class="gate-sub">This document is shared confidentially with event organizers. Enter the access password to continue.</p>
    <form class="gate-form" id="gateForm" autocomplete="off">
      <div class="gate-input-wrap">
        <input class="gate-input" type="password" id="pw" placeholder="Password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" autofocus>
        <button type="button" class="gate-show-pw" id="showPwBtn" aria-label="Show password">Show</button>
      </div>
      <button class="gate-btn" id="gateBtn" type="submit">Unlock</button>
    </form>
    <div class="gate-error" id="gateError" role="alert"></div>
    <div class="gate-foot">By accessing this document you agree to keep its contents confidential and not to reproduce or share its material. See our <a href="/privacy.html" target="_blank" rel="noopener" style="color: var(--primary);">Privacy Policy</a>.</div>
  </div>
</div>

<div class="viewer" id="viewer">
  <button class="lock-btn" id="lockBtn" type="button">Lock</button>
  <div id="content"></div>
</div>

<script>
(function () {
  const SALT_B64 = "__SALT_B64__";
  const IV_B64 = "__IV_B64__";
  const ITERATIONS = __ITERATIONS__;
  const CIPHER_B64 = "__CIPHERTEXT_B64__";

  const b64 = (s) => { const bin = atob(s); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
  const SALT = b64(SALT_B64);
  const IV   = b64(IV_B64);

  const gate      = document.getElementById('gate');
  const viewer    = document.getElementById('viewer');
  const form      = document.getElementById('gateForm');
  const pw        = document.getElementById('pw');
  const btn       = document.getElementById('gateBtn');
  const err       = document.getElementById('gateError');
  const content   = document.getElementById('content');
  const lockBtn   = document.getElementById('lockBtn');
  const showPwBtn = document.getElementById('showPwBtn');

  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  async function loadPortfolioVideos() {
    const container = content.querySelector('[data-portfolio-videos]');
    if (!container) return;
    try {
      const res = await fetch('/content/portfolio-videos.json', { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const videos = Array.isArray(data.videos) ? data.videos : [];
      container.innerHTML = videos.map((v) => {
        const color = v.color === 'green' ? 'green' : 'orange';
        return `
          <article class="pdoc-card">
            <h3 class="pdoc-card-title ${color}">${escapeHtml(v.title || '')}</h3>
            <div class="pdoc-embed pdoc-embed--video">
              <iframe src="${escapeHtml(v.url || '')}"
                      allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            </div>
          </article>`;
      }).join('');
    } catch (_) {}
  }

  async function deriveKey(password) {
    const normalized = password.normalize('NFC');
    const enc = new TextEncoder().encode(normalized);
    const mat = await crypto.subtle.importKey('raw', enc, { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: SALT, iterations: ITERATIONS, hash: 'SHA-256' },
      mat,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function unlock(password) {
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Unlocking…';
    try {
      const key = await deriveKey(password);
      const ct = b64(CIPHER_B64);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: IV }, key, ct);
      const html = new TextDecoder('utf-8').decode(new Uint8Array(plain));
      content.innerHTML = html;
      gate.style.display = 'none';
      viewer.classList.add('active');
      window.scrollTo(0, 0);
      loadPortfolioVideos();
      if (typeof gtag === 'function') {
        gtag('event', 'portfolio_unlock', { event_category: 'engagement' });
      }
    } catch (e) {
      err.textContent = 'Incorrect password. Try again.';
      pw.select();
    } finally {
      btn.disabled = false;
      btn.textContent = 'Unlock';
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); unlock(pw.value.trim()); });

  lockBtn.addEventListener('click', () => {
    content.innerHTML = '';
    viewer.classList.remove('active');
    gate.style.display = '';
    pw.value = '';
    pw.focus();
  });

  showPwBtn.addEventListener('click', () => {
    const isHidden = pw.type === 'password';
    pw.type = isHidden ? 'text' : 'password';
    showPwBtn.textContent = isHidden ? 'Hide' : 'Show';
    pw.focus();
  });
})();
</script>

</body>
</html>
